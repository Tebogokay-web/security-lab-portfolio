id: REPLACE-WITH-NEW-GUID
name: Privileged directory role assigned
description: Detects users added to a directory role.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [AuditLogs]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [PrivilegeEscalation, Persistence]
relevantTechniques: [T1098]
query: |
  AuditLogs
  | where OperationName has "Add member to role"
  | extend Actor = tostring(InitiatedBy.user.userPrincipalName)
  | project TimeGenerated, Actor, OperationName, TargetResources
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Actor
